<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>便签</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent; /* 透明窗口：未覆盖区域鼠标可穿透到桌面 */
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #notes-root { position: fixed; inset: 0; pointer-events: none; }

  .sticky-note {
    position: absolute;
    width: 220px;
    min-height: 120px;
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    pointer-events: auto; /* 便签本身可交互（覆盖在透明根之上的 click-through） */
    color: #333;
    overflow: hidden;
  }
  .sticky-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    cursor: move;
    user-select: none;
    background: rgba(0, 0, 0, 0.06);
  }
  .sticky-title { font-size: 12px; font-weight: 600; flex: 1; }
  .sticky-title-input {
    font-size: 12px; font-weight: 600; flex: 1; min-width: 0;
    border: none; background: transparent; color: inherit; outline: none; padding: 0;
  }
  .sticky-title-input:hover { text-decoration: underline dotted; }
  .sticky-close {
    border: none;
    background: transparent;
    font-size: 13px;
    cursor: pointer;
    color: #555;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .sticky-close:hover { background: rgba(0, 0, 0, 0.12); color: #c00; }
  .sticky-colors { display: flex; gap: 4px; }
  .sticky-colors .dot {
    width: 12px; height: 12px; border-radius: 50%;
    cursor: pointer; border: 1px solid rgba(0, 0, 0, 0.15);
  }
  .sticky-text {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    padding: 8px;
    font: 13px/1.5 inherit;
    color: inherit;
    min-height: 70px;
  }
  /* 便签勾选任务 */
  .sticky-tasks { padding: 0 8px 4px; display: flex; flex-direction: column; gap: 4px; }
  .task-row { display: flex; align-items: center; gap: 6px; }
  .task-row input[type="checkbox"] { flex: 0 0 auto; margin: 0; }
  .task-text {
    flex: 1; border: none; background: transparent; outline: none;
    font: 13px/1.4 inherit; color: inherit; min-width: 0;
  }
  .task-row.done .task-text { text-decoration: line-through; color: #999; }
  .task-del {
    flex: 0 0 auto; border: none; background: transparent; color: #933;
    cursor: pointer; font-size: 11px; padding: 0 2px; border-radius: 3px; line-height: 1;
  }
  .task-del:hover { background: rgba(0,0,0,0.12); }
  .task-add {
    align-self: flex-start; border: none; background: rgba(0,0,0,0.06);
    color: #333; cursor: pointer; font: 12px/1 inherit; padding: 3px 8px;
    border-radius: 10px; margin-top: 2px;
  }
  .task-add:hover { background: rgba(0,0,0,0.12); }
  /* 便签底部控制条（#3）：把「打开编辑器 / 新增便签 / 置顶」收进每条便签底部，图标按钮排成一排 */
  .sticky-foot {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    background: rgba(0, 0, 0, 0.04);
    white-space: nowrap;
  }
  .sticky-foot button {
    flex: 1 1 auto;
    border: none;
    background: transparent;
    color: #335;
    font: 14px/1 inherit;
    cursor: pointer;
    padding: 4px 0;
    border-radius: 8px;
    text-align: center;
  }
  .sticky-foot button:hover { background: rgba(0, 0, 0, 0.12); }
  .sticky-foot .foot-pin.on { background: #ffe08a; color: #7a5b00; }
  .sticky-foot .spacer { flex: 1; }
</style>
</head>
<body>
<div id="notes-root"></div>
<script>
  (function () {
    var root = document.getElementById("notes-root");

    var COLORS = ["#fff7c2", "#c8f0d8", "#ffe0c2", "#cfe3ff", "#f0c8ef"];
    var notes = [];
    var dragging = null; // { note, el, sx, sy, ox, oy }

    function setIgnore(v) {
      try { window.api.notesSetIgnore(v); } catch (e) {}
    }

    function id() {
      return "n" + Date.now() + Math.random().toString(36).slice(2, 6);
    }

    function debounce(fn, ms) {
      var t = null;
      return function () {
        var a = arguments, self = this;
        clearTimeout(t);
        t = setTimeout(function () { fn.apply(self, a); }, ms);
      };
    }
    var upsert = debounce(function (note) {
      try { window.api.notesUpsert(note, true); } catch (e) {}
    }, 300);

    // #3：便签窗口内直接新建一条便签（fromNotes=false → 主窗口列表也会同步刷新）
    function createNoteFromNotes() {
      var n = {
        id: id(),
        name: "便签 " + (notes.length + 1),
        text: "",
        x: 120 + (notes.length % 6) * 28,
        y: 120 + (notes.length % 6) * 28,
        color: COLORS[notes.length % COLORS.length],
        open: true,
        pinned: false,
      };
      notes.push(n);
      render(); // 本地立即出现
      try { window.api.notesUpsert(n, false); } catch (e) {}
    }

    function render() {
      root.innerHTML = "";
      notes
        .filter(function (n) { return n.open !== false; })
        .forEach(function (n) { root.appendChild(buildEl(n)); });
    }

    // 便签勾选任务列表：已完成项显示删除线 + 灰色；可增删。
    function buildTasks(n) {
      if (!Array.isArray(n.tasks)) n.tasks = [];
      var wrap = document.createElement("div");
      wrap.className = "sticky-tasks";

      function renderTasks() {
        wrap.innerHTML = "";
        (n.tasks || []).forEach(function (t, i) {
          var row = document.createElement("div");
          row.className = "task-row" + (t.done ? " done" : "");
          var cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!t.done;
          cb.addEventListener("change", function () {
            t.done = cb.checked;
            row.classList.toggle("done", t.done);
            upsert(n);
          });
          var inp = document.createElement("input");
          inp.type = "text";
          inp.className = "task-text";
          inp.value = t.text || "";
          inp.placeholder = "任务内容…";
          inp.addEventListener("input", function () {
            t.text = inp.value;
            upsert(n);
          });
          var del = document.createElement("button");
          del.className = "task-del";
          del.textContent = "✕";
          del.title = "删除任务";
          del.addEventListener("click", function (ev) {
            ev.stopPropagation();
            n.tasks.splice(i, 1);
            renderTasks();
            upsert(n);
          });
          row.append(cb, inp, del);
          wrap.appendChild(row);
        });
        var add = document.createElement("button");
        add.className = "task-add";
        add.textContent = "＋ 添加任务";
        add.addEventListener("click", function (ev) {
          ev.stopPropagation();
          n.tasks.push({ id: id(), text: "", done: false });
          renderTasks();
          var rows = wrap.querySelectorAll(".task-text");
          if (rows.length) rows[rows.length - 1].focus();
          upsert(n);
        });
        wrap.appendChild(add);
      }

      renderTasks();
      return wrap;
    }

    function buildEl(n) {
      var el = document.createElement("div");
      el.className = "sticky-note";
      el.style.left = (n.x || 120) + "px";
      el.style.top = (n.y || 120) + "px";
      el.style.background = n.color || COLORS[0];

      var head = document.createElement("div");
      head.className = "sticky-head";
      var title = document.createElement("input");
      title.className = "sticky-title-input";
      title.value = n.name || "便签";
      title.placeholder = "便签名称";
      title.title = "便签名称（点击修改）";
      title.addEventListener("mousedown", function (ev) { ev.stopPropagation(); });
      title.addEventListener("click", function (ev) { ev.stopPropagation(); });
      title.addEventListener("input", function () {
        n.name = title.value;
        upsert(n);
      });

      var colors = document.createElement("div");
      colors.className = "sticky-colors";
      COLORS.forEach(function (c) {
        var d = document.createElement("span");
        d.className = "dot";
        d.style.background = c;
        d.title = "换颜色";
        d.addEventListener("click", function (ev) {
          ev.stopPropagation();
          n.color = c;
          el.style.background = c;
          upsert(n);
        });
        colors.appendChild(d);
      });

      var close = document.createElement("button");
      close.className = "sticky-close";
      close.textContent = "✕";
      close.title = "隐藏便签（保留在「便签」列表，可重新显示；删除请在列表里点 ✕）";
      close.addEventListener("click", function (ev) {
        ev.stopPropagation();
        // 仅隐藏：保留数据，主窗口「便签」列表仍可重新显示/删除
        n.open = false;
        try { window.api.notesUpsert(n, true); } catch (e) {}
        // #4：便签被移除后不会触发 mouseleave，若当前处于可交互(ignore=false)状态，
        // 透明窗口会继续捕获鼠标导致桌面点不动。显式恢复穿透，主进程也会在最后一个
        // 便签隐藏时隐藏整个窗口，彻底释放鼠标。
        setIgnore(true);
        render(); // 本地立即重绘（广播对便签窗口被抑制），让便签真正消失
      });

      head.append(title, colors, close);

      var ta = document.createElement("textarea");
      ta.className = "sticky-text";
      ta.value = n.text || "";
      ta.placeholder = "随手记点什么…";
      ta.addEventListener("input", function () {
        n.text = ta.value;
        upsert(n);
      });

      el.append(head, buildTasks(n), ta);

      // 底部控制条（#3）：把入口收进每条便签，图标按钮排成一排（#1 不再换行）
      var foot = document.createElement("div");
      foot.className = "sticky-foot";

      var openBtn = document.createElement("button");
      openBtn.className = "foot-open";
      openBtn.textContent = "📝";
      openBtn.title = "打开编辑器";
      openBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        try { window.api.openMainApp(); } catch (e) {}
      });

      var newBtn = document.createElement("button");
      newBtn.className = "foot-new";
      newBtn.textContent = "＋";
      newBtn.title = "新增便签";
      newBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        createNoteFromNotes();
      });

      var pinBtn = document.createElement("button");
      pinBtn.className = "foot-pin" + (n.pinned ? " on" : "");
      pinBtn.textContent = "📌";
      pinBtn.title = n.pinned ? "已置顶（点击取消）" : "置顶显示";
      pinBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        n.pinned = !n.pinned;
        pinBtn.classList.toggle("on", n.pinned);
        pinBtn.title = n.pinned ? "已置顶（点击取消）" : "置顶显示";
        upsert(n); // 主进程 notes:upsert 会据此重新计算窗口是否置顶
      });

      foot.append(openBtn, newBtn, pinBtn);
      el.append(foot);

      // 鼠标穿透控制：进入便签→可交互；离开（且非拖拽中）→穿透
      el.addEventListener("mouseenter", function () { setIgnore(false); });
      el.addEventListener("mouseleave", function () {
        if (!dragging) setIgnore(true);
      });

      // 拖拽移动（仅表头）
      head.addEventListener("mousedown", function (e) {
        if (e.target === close || e.target === title || colors.contains(e.target)) return;
        dragging = { note: n, el: el, sx: e.clientX, sy: e.clientY, ox: n.x || 120, oy: n.y || 120 };
        setIgnore(false);
        e.preventDefault();
      });

      return el;
    }

    document.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      dragging.note.x = Math.max(0, dragging.ox + (e.clientX - dragging.sx));
      dragging.note.y = Math.max(0, dragging.oy + (e.clientY - dragging.sy));
      dragging.el.style.left = dragging.note.x + "px";
      dragging.el.style.top = dragging.note.y + "px";
    });
    document.addEventListener("mouseup", function () {
      if (!dragging) return;
      upsert(dragging.note); // 落点后持久化坐标
      dragging = null;
    });

    // 主进程广播（新建/显示隐藏/删除来自主窗口）时重渲染
    try {
      window.api.onNotesChanged(function (store) {
        notes = store || [];
        render();
      });
    } catch (e) {}

    // 初始加载
    window.api.notesGetAll().then(function (store) {
      notes = store || [];
      render();
    }).catch(function () { render(); });
  })();
</script>
</body>
</html>
